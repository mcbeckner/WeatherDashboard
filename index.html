        function initializeResizablePanels() {
            const mainContainer = document.querySelector('.main-container');
            const weatherPanel = mainContainer.querySelector('.panel:not(.map-panel):not(.full-width-panel)');
            const mapPanel = mainContainer.querySelector('.panel.map-panel');
            const stationPanel = mainContainer.querySelector('.panel.full-width-panel');

            if (!weatherPanel || !mapPanel || !stationPanel) {
                console.error("Resizable panels: Can't find all required panel elements.");
                return;
            }

            const topRowWrapper = document.createElement('div');
            topRowWrapper.id = 'topRowWrapper';

            const resizerX = document.createElement('div');
            resizerX.className = 'resizer-x';

            const resizerY = document.createElement('div');
            resizerY.className = 'resizer-y';
            
            if (!mainContainer.classList.contains('resizable-layout')) {
                 mainContainer.classList.add('resizable-layout');
            
                topRowWrapper.appendChild(weatherPanel);
                topRowWrapper.appendChild(resizerX);
                topRowWrapper.appendChild(mapPanel);
                
                mainContainer.insertBefore(topRowWrapper, stationPanel);
                mainContainer.insertBefore(resizerY, stationPanel);
            }

            weatherPanel.style.flex = '0 0 35%';
            mapPanel.style.flex = '1 1 65%';

            resizerX.addEventListener('mousedown', function(md_e) {
                md_e.preventDefault();
                const startX = md_e.clientX;
                const startWidth = weatherPanel.offsetWidth;
                resizerX.classList.add('active');

                function handleMouseMoveX(mm_e) {
                    const newWidth = startWidth + (mm_e.clientX - startX);
                    if (newWidth > 350 && (topRowWrapper.offsetWidth - newWidth - resizerX.offsetWidth) > 500) { 
                       weatherPanel.style.flex = `0 0 ${newWidth}px`;
                       map.invalidateSize(); 
                    }
                }

                function handleMouseUpX() {
                    resizerX.classList.remove('active');
                    window.removeEventListener('mousemove', handleMouseMoveX);
                    window.removeEventListener('mouseup', handleMouseUpX);
                    map.invalidateSize(); 
                }

                window.addEventListener('mousemove', handleMouseMoveX);
                window.addEventListener('mouseup', handleMouseUpX);
            });

            resizerY.addEventListener('mousedown', function(md_e) {
                md_e.preventDefault();
                const startY = md_e.clientY;
                const startHeight = topRowWrapper.offsetHeight;
                resizerY.classList.add('active');
                
                function handleMouseMoveY(mm_e) {
                    const newHeight = startHeight + (mm_e.clientY - startY);
                    if (newHeight > 400) { 
                        topRowWrapper.style.height = `${newHeight}px`;
                        map.invalidateSize();
                    }
                }

                function handleMouseUpY() {
                    resizerY.classList.remove('active');
                    window.removeEventListener('mousemove', handleMouseMoveY);
                    window.removeEventListener('mouseup', handleMouseUpY);
                    map.invalidateSize(); 
                }

                window.addEventListener('mousemove', handleMouseMoveY);
                window.addEventListener('mouseup', handleMouseUpY);
            });
        }
        
        function initializeLightningLayer() {
            const lightningToggle = document.getElementById('lightning-toggle');
            const lightningUrl = 'https://tiles.lightningmaps.org/blitzortung/osm_light/{z}/{x}/{y}.png';
            
            lightningToggle.addEventListener('change', () => {
                if (lightningToggle.checked) {
                    if (!lightningLayer) {
                        lightningLayer = L.tileLayer(lightningUrl, {
                            attribution: 'LightningMaps.org',
                            opacity: 0.7,
                            zIndex: 15 
                        });
                    }
                    map.addLayer(lightningLayer);
                } else {
                    if (lightningLayer && map.hasLayer(lightningLayer)) {
                        map.removeLayer(lightningLayer);
                    }
                }
                updateSigmetLegendVisibility(); 
            });
        }
        
        function showNotification(message) {
            const container = document.getElementById('notification-container');
            const toast = document.createElement('div');
            toast.className = 'notification-toast';
            toast.innerHTML = message;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 5000); 
        }
        
        function initializeMuteControls() {
            document.body.addEventListener('click', (e) => {
                if (e.target.matches('.mute-station-btn')) {
                    const icao = e.target.dataset.icao;
                    if (!icao) return;
                    
                    const index = mutedStations.indexOf(icao);
                    if (index > -1) {
                        mutedStations.splice(index, 1); 
                    } else {
                        mutedStations.push(icao); 
                    }
                    saveMutedStations();
                    
                    updateMuteButtonUI(icao);
                }
            });
        }

        function updateMuteButtonUI(icao) {
            const buttons = document.querySelectorAll(`.mute-station-btn[data-icao="${icao}"]`);
            const isMuted = mutedStations.includes(icao);
            
            buttons.forEach(button => {
                button.innerHTML = isMuted ? '&#128277;' : '&#128276;';
                button.title = isMuted ? 'Unmute Alerts' : 'Mute Alerts';
                button.classList.toggle('muted', isMuted);
            });
        }

        function initializeFlightRouteAnalysis() {
            const form = document.getElementById('flight-route-form');
            const routeInput = document.getElementById('flight-route-input');
            
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const routeString = routeInput.value.trim().toUpperCase();
                if (!routeString) return;

                const waypoints = routeString.split(/\s+/).filter(Boolean);
                if (waypoints.length < 2) {
                    alert('Please enter at least two ICAO codes for a route.');
                    return;
                }

                document.getElementById('flight-route-panel').style.display = 'block';
                document.getElementById('route-weather-summary').innerHTML = 'Analyzing...';
                document.getElementById('route-hazards-summary').innerHTML = 'Analyzing...';
                drawTerrainProfile([], 'Loading terrain...'); 

                const waypointDataPromises = waypoints.map(icao => 
                    stationDataCache[icao]?.metar?.latitude ? Promise.resolve(stationDataCache[icao]) : fetchStationData(icao)
                );
                
                const waypointData = (await Promise.all(waypointDataPromises)).filter(Boolean);

                if (waypointData.length !== waypoints.length) {
                    alert('Could not fetch data for one or more waypoints. Please check the ICAO codes.');
                    return;
                }

                const latLngs = waypointData.map(data => [data.metar.latitude, data.metar.longitude]);
                if (flightPathLayer) map.removeLayer(flightPathLayer);
                flightPathLayer = L.polyline(latLngs, { color: 'var(--route-path-color)', weight: 3, dashArray: '5, 5' }).addTo(map);
                map.fitBounds(flightPathLayer.getBounds().pad(0.1));
                
                populateRouteWeather(waypoints);

                checkRouteHazards(flightPathLayer);

                fetchAndDrawTerrain(latLngs, waypoints);
            });
        }

        function populateRouteWeather(waypoints) {
            const summaryDiv = document.getElementById('route-weather-summary');
            let html = '';
            waypoints.forEach(icao => {
                const data = stationDataCache[icao];
                if (data && data.metar) {
                    const category = getFlightCategory(data.metar);
                    html += `
                        <div class="weather-text" style="margin-bottom: 10px; border-left: 5px solid ${category.color};">
                            <strong>${icao} (${category.label})</strong><br>
                            METAR: ${data.metar.raw || 'N/A'}<br>
                            TAF: ${data.taf ? (data.taf.raw || 'N/A') : 'N/A'}
                        </div>
                    `;
                }
            });
            summaryDiv.innerHTML = html || 'No weather data available for this route.';
        }

        function checkRouteHazards(routeLine) {
             const hazardsDiv = document.getElementById('route-hazards-summary');
             let intersectingHazards = [];
             
             const routeBounds = routeLine.getBounds();

             function checkLayer(layer, type) {
                 if (layer && map.hasLayer(layer)) {
                     layer.eachLayer(featureLayer => {
                         if (routeBounds.intersects(featureLayer.getBounds())) {
                              if (isPolylineIntersectingPolygon(routeLine.getLatLngs(), featureLayer.getLatLngs()[0])) {
                                 const props = featureLayer.feature.properties;
                                 const hazard = props.hazard || `(${type})`;
                                 intersectingHazards.push(`${hazard} from ${formatIsoDate(props.validTimeFrom)} to ${formatIsoDate(props.validTimeTo)}`);
                             }
                         }
                     });
                 }
             }

             checkLayer(internationalSigmetLayer, "Int'l SIGMET");
             checkLayer(conusAirSigmetLayer, "CONUS AIR/SIGMET");
             
             if (intersectingHazards.length > 0) {
                 hazardsDiv.innerHTML = '<ul>' + intersectingHazards.map(h => `<li>${h}</li>`).join('') + '</ul>';
             } else {
                 hazardsDiv.innerHTML = 'No intersecting AIR/SIGMETs found.';
             }
        }

        function isPolylineIntersectingPolygon(lineLatLngs, polyLatLngs) {
            for (let i = 0; i < lineLatLngs.length; i++) {
                if (isMarkerInsidePolygon(lineLatLngs[i], polyLatLngs)) {
                    return true;
                }
            }
            return false;
        }

        function isMarkerInsidePolygon(marker, poly) {
            let inside = false;
            const x = marker.lat, y = marker.lng;
            for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
                const xi = poly[i].lat, yi = poly[i].lng;
                const xj = poly[j].lat, yj = poly[j].lng;
                const intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        async function fetchAndDrawTerrain(latLngs, waypoints) {
            try {
                drawTerrainProfile([], 'Fetching terrain data...');

                const samplesPerSegment = 50; 
                const routePoints = [];
                
                if (latLngs.length === 2) {
                    const start = latLngs[0];
                    const end = latLngs[1];
                    for (let j = 0; j <= samplesPerSegment; j++) {
                        const ratio = j / samplesPerSegment;
                        const lat = start[0] + (end[0] - start[0]) * ratio;
                        const lon = start[1] + (end[1] - start[1]) * ratio;
                        routePoints.push({latitude: lat, longitude: lon});
                    }
                } else {
                    for (let i = 0; i < latLngs.length - 1; i++) {
                        const start = latLngs[i];
                        const end = latLngs[i+1];
                        const currentSegmentSamples = (i === latLngs.length - 2) ? samplesPerSegment : samplesPerSegment - 1; 

                        for (let j = 0; j <= currentSegmentSamples; j++) {
                            const ratio = j / currentSegmentSamples;
                            const lat = start[0] + (end[0] - start[0]) * ratio;
                            const lon = start[1] + (end[1] - start[1]) * ratio;
                            routePoints.push({latitude: lat, longitude: lon});
                        }
                    }
                }

                const GOOGLE_MAX_LOCATIONS = 500; 
                const pointsForGoogleApi = routePoints.slice(0, GOOGLE_MAX_LOCATIONS);
                const locationsParam = pointsForGoogleApi.map(p => `${p.latitude},${p.longitude}`).join('|');

                if (routePoints.length > GOOGLE_MAX_LOCATIONS) {
                    drawTerrainProfile([], `Route too long for full elevation detail. Showing for first ${GOOGLE_MAX_LOCATIONS} points.`);
                    await new Promise(resolve => setTimeout(resolve, 3000)); 
                }

                // USE UPDATED PROXY
                const googleElevationUrl = `https://maps.googleapis.com/maps/api/elevation/json?locations=${locationsParam}&key=${googleApiKey}`;
                const proxiedUrl = CORS_PROXY_URL + encodeURIComponent(googleElevationUrl);
                
                const elevationResponse = await fetch(proxiedUrl);

                if (!elevationResponse.ok) {
                    const errorData = await elevationResponse.json().catch(() => ({error_message: 'No JSON response'}));
                    throw new Error(`Google Elevation API failed. Status: ${elevationResponse.status}. Error: ${errorData.error_message || 'Unknown API error.'}`);
                }

                const elevationData = await elevationResponse.json();

                if (elevationData.status !== 'OK' || !elevationData.results || elevationData.results.length === 0) {
                    throw new Error(`Google Elevation API returned no valid terrain data. Status: ${elevationData.status}. Error: ${elevationData.error_message || 'No results.'}`);
                }

                const elevations = elevationData.results.map(p => p.elevation * 3.28084); 

                let totalDistance = 0;
                const distances = [0];
                for(let i=1; i < latLngs.length; i++) {
                    totalDistance += L.latLng(latLngs[i-1]).distanceTo(L.latLng(latLngs[i]));
                    distances.push(totalDistance);
                }

                const waypointInfo = waypoints.map((icao, i) => ({
                    icao: icao,
                    distance: distances[i]
                }));
                
                drawTerrainProfile(elevations, null, waypointInfo, totalDistance);

            } catch (error) {
                console.error("Error in fetchAndDrawTerrain:", error); 
                drawTerrainProfile([], `Error fetching terrain: ${error.message}`, null, 1);
            }
        }

        function drawTerrainProfile(elevations, message = null, waypointInfo = [], totalDistance = 1) {
            const canvas = document.getElementById('terrain-canvas');
            const ctx = canvas.getContext('2d');

            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);

            const width = canvas.width / dpr;
            const height = canvas.height / dpr;

            ctx.clearRect(0, 0, width, height);

            const padding = { top: 20, right: 20, bottom: 40, left: 60 };

            if (message || elevations.length === 0) {
                ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--body-text-color');
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(message || 'No terrain data available.', width / 2, height / 2);
                return;
            }

            const maxElev = Math.max(...elevations, 1000); 
            const minElev = Math.min(...elevations);

            const yRange = maxElev - minElev;
            const effectiveHeight = height - padding.top - padding.bottom;
            const effectiveWidth = width - padding.left - padding.right;

            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--cross-section-axis-color');
            ctx.fillStyle = ctx.strokeStyle;
            ctx.lineWidth = 1;
            ctx.font = '10px sans-serif';

            const yTicks = 5;
            for (let i = 0; i <= yTicks; i++) {
                const alt = minElev + (yRange / yTicks) * i;
                const y = height - padding.bottom - (effectiveHeight / yTicks) * i;
                
                ctx.textAlign = 'right';
                ctx.fillText(`${Math.round(alt).toLocaleString()} ft`, padding.left - 8, y + 3);

                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(width - padding.right, y);
                ctx.stroke();
            }

             ctx.textAlign = 'center';
            if (waypointInfo.length > 0) {
                 waypointInfo.forEach(wp => {
                    const x = padding.left + (wp.distance / totalDistance) * effectiveWidth;
                    
                    ctx.fillText(wp.icao, x, height - padding.bottom + 15);
                    ctx.beginPath();
                    ctx.moveTo(x, height - padding.bottom);
                    ctx.lineTo(x, height - padding.bottom + 5);
                    ctx.stroke();
                });
            }
           
            ctx.beginPath();
            ctx.moveTo(padding.left, height - padding.bottom);

            elevations.forEach((elev, i) => {
                const x = padding.left + (i / (elevations.length - 1)) * effectiveWidth;
                const y = height - padding.bottom - ((elev - minElev) / yRange) * effectiveHeight;
                ctx.lineTo(x, y);
            });

            ctx.lineTo(width - padding.right, height - padding.bottom);
            ctx.lineTo(padding.left, height - padding.bottom); 
            ctx.closePath();

            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--cross-section-terrain-fill');
            ctx.fill();
        }

         function initializeDashboard() {
            initializeClock();
            initializePanelControls();
            initializeMapFullscreen();
            initializeRadarLayer();
            initializeSatelliteLayer();
            initializeLightningLayer(); 
            initializeMuteControls(); 
            initializeDarkMode();
            initializeFlightRouteAnalysis(); 
            addMapLegend(); 

            updateSigmetLegendVisibility();

            intlSigmetToggle.addEventListener('change', () => {
                if (intlSigmetToggle.checked) { refreshInternationalSigmetData(); } 
                else {
                    if (internationalSigmetLayer && map.hasLayer(internationalSigmetLayer)) map.removeLayer(internationalSigmetLayer);
                    sigmetStatusMessage.textContent = ""; 
                }
                updateSigmetLegendVisibility(); 
            });

            conusAirSigmetToggle.addEventListener('change', () => {
                if (conusAirSigmetToggle.checked) { refreshConusAirSigMetData(); } 
                else {
                    if (conusAirSigmetLayer && map.hasLayer(conusAirSigmetLayer)) map.removeLayer(conusAirSigmetLayer);
                    conusStatusMessage.textContent = "";
                }
                updateSigmetLegendVisibility(); 
            });

            viewRawConusBtn.addEventListener('click', () => {
                fetchConusAirSigMetData(true); 
            });
            
            // WMS Listeners
            wmsToggle.addEventListener('change', toggleWmsLayer);
            wmsLayerSelect.addEventListener('change', toggleWmsLayer);


            summaryTableBody.addEventListener('click', e => { if (e.target.matches('.remove-station-btn')) removeStation(e.target.dataset.icao); });
            stationGrid.addEventListener('click', e => { if (e.target.matches('.remove-station-btn')) removeStation(e.target.dataset.icao); });
            addStationForm.addEventListener('submit', e => {
                e.preventDefault();
                const input = document.getElementById('add-station-input');
                const newIcao = input.value.trim().toUpperCase();
                if (newIcao.length === 4 && !airports.includes(newIcao)) { 
                    airports.push(newIcao); 
                    saveStationList(); 
                    fetchStationData(newIcao, true); 
                } else if (newIcao.length !== 4) {
                    alert('Please enter a valid 4-character ICAO code.');
                } else if (airports.includes(newIcao)) {
                    alert('Station already in list.');
                }
                input.value = '';
            });
            mapModeRadios.forEach(radio => radio.addEventListener('change', onMapModeChange));
            const applyTafToggleState = () => { document.body.classList.toggle('hide-tafs', !tafToggle.checked); localStorage.setItem('showTafs', tafToggle.checked); };
            tafToggle.addEventListener('change', applyTafToggleState);
            const savedTafPref = localStorage.getItem('showTafs');
            if (savedTafPref !== null) tafToggle.checked = (savedTafPref === 'true');
            applyTafToggleState();
            
            const updateAll = () => {
                document.getElementById('last-updated').textContent = "loading...";
                Promise.all(airports.map(icao => fetchStationData(icao)))
                .then(() => { 
                    document.getElementById('last-updated').textContent = new Date().toLocaleTimeString();
                    if (intlSigmetToggle.checked) refreshInternationalSigmetData();
                    if (conusAirSigmetToggle.checked) refreshConusAirSigMetData();
                    if (wmsToggle.checked) toggleWmsLayer(); // Refresh WMS on interval
                })
                .catch(err => { console.error("Update error:", err); document.getElementById('last-updated').textContent = "Update failed"; });
            };
            updateAll();
            setInterval(updateAll, refreshInterval);

            initializeResizablePanels();
        }
        initializeDashboard();
    });
    </script>
