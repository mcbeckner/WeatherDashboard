<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bifrost WMS Debugger (Super Advanced)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
        #controls { 
            padding: 10px; background: #333; color: white; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.3); z-index: 1000;
        }
        #map { flex-grow: 1; width: 100%; background: #ddd; }
        
        #debug-log {
            position: absolute; bottom: 10px; left: 10px; width: 450px; height: 250px; /* Slightly larger log box */
            background: rgba(0, 0, 0, 0.9); color: #0f0;
            font-family: monospace; font-size: 12px;
            padding: 10px; overflow-y: auto; z-index: 2000;
            border-radius: 4px; pointer-events: none;
            border: 1px solid #00ff00;
        }
        select, input[type="text"], button { padding: 5px; border-radius: 3px; border: none; }
        button { cursor: pointer; background: #007bff; color: white; font-weight: bold; }
        button:hover { background: #0056b3; }
        .control-group { display: flex; align-items: center; gap: 5px; }
        #layer-name-input { width: 150px; }
    </style>
</head>
<body>

    <div id="controls">
        <strong>Bifrost WMS Debugger</strong>
        <div class="control-group">
            <label>WMS Preset:</label>
            <select id="layer-select">
                <!-- AFWeather / Bifrost Layers -->
                <option value="AFW_Radar">AFW Global Radar (Bifrost)</option>
                <option value="AFW_Cloud">AFW Global Cloud (Bifrost)</option>
                <option value="AFW_Vis">AFW Global Visible (Bifrost)</option>
                <!-- NOAA Backup Layers (for comparison) -->
                <option value="NOAA_Radar">NOAA NEXRAD (Public)</option>
                <option value="NOAA_Sat">NOAA Satellite (Public)</option>
            </select>
        </div>
        <div class="control-group">
            <label for="layer-name-input">WMS Layer Name:</label>
            <input type="text" id="layer-name-input" value="Global_Radar" title="Enter the exact WMS Layer name.">
        </div>
        <div class="control-group">
            <button id="load-btn">Load Layer</button>
            <button id="clear-btn" style="background:#dc3545;">Clear Map</button>
        </div>
        <div style="margin-left:auto; font-size: 0.8em; color: #aaa; padding-right: 10px;">
            <p style="margin:0;">1. Open new tab, log into <a href="https://datadocs.afweather.mil/" target="_blank" style="color:yellow;">DataDocs (CAC)</a>. Keep it open.</p>
            <p style="margin:0;">2. **Important**: If AFW layers fail, check the browser's Network tab (if accessible).</p>
        </div>
    </div>

    <div id="map"></div>
    <div id="debug-log">Waiting for action...</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Initialize Map
        const map = L.map('map').setView([39.8283, -98.5795], 4); // Center of US

        // Base Layer (OpenTopoMap - No API Key needed, clean terrain)
        L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17,
            attribution: 'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, <a href="http://viewfinderpanoramas.org">SRTM</a> | Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)'
        }).addTo(map);

        let currentWmsLayer = null;
        const logBox = document.getElementById('debug-log');
        const layerSelect = document.getElementById('layer-select');
        const layerNameInput = document.getElementById('layer-name-input');

        // Logging Function
        function log(msg) {
            const time = new Date().toLocaleTimeString();
            logBox.innerHTML += `<div>[${time}] ${msg}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
            // console.log(`[LOG] ${msg}`); // Removed console.log as user cannot access
        }

        // Update layer name input when preset selection changes
        layerSelect.addEventListener('change', () => {
            const selectedValue = layerSelect.value;
            if (selectedValue === 'AFW_Radar') layerNameInput.value = 'Global_Radar';
            else if (selectedValue === 'AFW_Cloud') layerNameInput.value = 'Global_Cloud';
            else if (selectedValue === 'AFW_Vis') layerNameInput.value = 'Global_Vis';
            else layerNameInput.value = ''; // Clear for NOAA layers as they use fixed '1'
        });


        document.getElementById('load-btn').addEventListener('click', () => {
            const selectedPreset = layerSelect.value;
            const customLayerName = layerNameInput.value.trim();
            loadWmsLayer(selectedPreset, customLayerName);
        });

        document.getElementById('clear-btn').addEventListener('click', () => {
            if (currentWmsLayer) {
                map.removeLayer(currentWmsLayer);
                currentWmsLayer = null;
                log("Map cleared.");
            }
        });

        function loadWmsLayer(presetType, customLayerName) {
            if (currentWmsLayer) map.removeLayer(currentWmsLayer);

            let url = '';
            let layerName = customLayerName; // Use custom name if provided, otherwise derived
            let format = 'image/png';
            let attribution = '';
            let errorHint = '';
            
            // --- CONFIGURATION BLOCK ---
            if (presetType.startsWith('AFW_')) {
                url = 'https://generated.afweather.mil/wms/global_vis?';
                attribution = 'AFWeather Bifrost';
                errorHint = 'For AFW layers: 1. Ensure you are fully logged into DataDocs in another tab. 2. Verify the "WMS Layer Name" is exact. 3. Browser security/GPO might be blocking (contact IT if persistent).';
            } else if (presetType === 'NOAA_Radar') {
                url = 'https://nowcoast.noaa.gov/arcgis/services/nowcoast/radar_meteo_imagery_nexrad_time/MapServer/WMSServer';
                layerName = '1'; // Fixed layer name for NOAA Radar
                attribution = 'NOAA nowCoast';
                errorHint = 'Public NOAA layer, should work if internet connectivity is fine.';
            } else if (presetType === 'NOAA_Sat') {
                url = 'https://nowcoast.noaa.gov/arcgis/services/nowcoast/sat_meteo_imagery_time/MapServer/WMSServer';
                layerName = '1'; // Fixed layer name for NOAA Visible Satellite
                attribution = 'NOAA nowCoast';
                errorHint = 'Public NOAA layer, should work if internet connectivity is fine.';
            }

            if (!url) {
                log(`ERROR: No URL defined for preset: ${presetType}`);
                return;
            }
            if (!layerName) {
                log(`ERROR: WMS Layer Name is empty for preset: ${presetType}`);
                return;
            }

            log(`Attempting to load: ${presetType}`);
            log(`WMS URL: ${url}`);
            log(`WMS Layer Name: ${layerName}`);

            try {
                currentWmsLayer = L.tileLayer.wms(url, {
                    layers: layerName,
                    format: format,
                    transparent: true,
                    version: '1.1.1', // Reverting to 1.1.1 for potentially broader compatibility
                    attribution: attribution,
                    crs: L.CRS.EPSG3857, 
                    opacity: 0.65,
                    uppercase: true, 
                    crossOrigin: true 
                });

                currentWmsLayer.on('loading', function() {
                    log("Status: WMS layer `loading` event fired. Tiles being requested...");
                });

                currentWmsLayer.on('load', function() {
                    log("Status: WMS layer `load` event fired. All tiles may have been requested.");
                    log("Note: If map is empty, the tiles might be transparent or requests were blocked silently.");
                });
                
                currentWmsLayer.on('tileerror', function(e) {
                    let errorDetails = '';
                    if (e.error) {
                        if (e.error.message) errorDetails += `Message: "${e.error.message}" `;
                        if (e.error.code) errorDetails += `Code: ${e.error.code} `;
                    }
                    log(`ERROR: A tile failed. URL: ${e.url || 'undefined'}. ${errorDetails}. Hints: ${errorHint}`);
                });

                currentWmsLayer.addTo(map);
                log("Action: Layer added to map. Browser should be sending tile requests.");

            } catch (e) {
                log(`CRITICAL JS ERROR during layer creation: ${e.message}`);
            }
        }
    </script>
</body>
</html>
