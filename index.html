<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bifrost WMS Debugger (Super Advanced v4)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
        #controls { 
            padding: 10px; background: #333; color: white; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.3); z-index: 1000;
        }
        #map { flex-grow: 1; width: 100%; background: #ddd; }
        
        #debug-log {
            position: absolute; bottom: 10px; left: 10px; width: 450px; height: 250px; /* Slightly larger log box */
            background: rgba(0, 0, 0, 0.9); color: #0f0;
            font-family: monospace; font-size: 12px;
            padding: 10px; overflow-y: auto; z-index: 2000;
            border-radius: 4px; pointer-events: none; /* Allows clicks to pass through to map */
            border: 1px solid #00ff00;
        }
        select, input[type="text"], button { padding: 5px; border-radius: 3px; border: none; }
        button { cursor: pointer; background: #007bff; color: white; font-weight: bold; }
        button:hover { background: #0056b3; }
        .control-group { display: flex; align-items: center; gap: 5px; }
        #layer-name-input { width: 150px; }
    </style>
</head>
<body>

    <div id="controls">
        <strong>Bifrost WMS Debugger</strong>
        <div class="control-group">
            <label>WMS Preset:</label>
            <select id="layer-select">
                <!-- AFWeather / Bifrost Layers (using documented examples) -->
                <option value="AFW_CloudTops">AFW GALWEM Cloud Tops (Bifrost)</option>
                <option value="AFW_SoilMoisture">AFW GALWEM Soil Moisture (Bifrost)</option>
                <!-- NOAA Backup Layers (for comparison) -->
                <option value="NOAA_Radar">NOAA NEXRAD (Public)</option>
                <option value="NOAA_Sat">NOAA Satellite (Public)</option>
            </select>
        </div>
        <div class="control-group">
            <label for="layer-name-input">WMS Layer Name:</label>
            <input type="text" id="layer-name-input" value="GALWEM_CloudTops" title="Enter the exact WMS Layer name as found in GetCapabilities.">
        </div>
        <div class="control-group">
            <button id="load-btn">Load Layer</button>
            <button id="clear-btn" style="background:#dc3545;">Clear Map</button>
            <button id="test-afw-connection-btn" style="background:#28a745;">Test AFW Connection</button>
        </div>
        <div style="margin-left:auto; font-size: 0.8em; color: #aaa; padding-right: 10px;">
            <p style="margin:0;">1. Open new tab, log into <a href="https://datadocs.afweather.mil/" target="_blank" style="color:yellow;">DataDocs (CAC)</a>. Keep it open.</p>
            <p style="margin:0;">2. **Important**: This tool logs what it can. Network issues are complex on secured networks.</p>
        </div>
    </div>

    <div id="map"></div>
    <div id="debug-log">Waiting for action...</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Initialize Map
        const map = L.map('map').setView([39.8283, -98.5795], 4); // Center of US

        // Base Layer (OpenTopoMap - No API Key needed, clean terrain)
        L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17,
            attribution: 'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, <a href="http://viewfinderpanoramas.org">SRTM</a> | Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)'
        }).addTo(map);

        let currentWmsLayer = null;
        const logBox = document.getElementById('debug-log');
        const layerSelect = document.getElementById('layer-select');
        const layerNameInput = document.getElementById('layer-name-input');
        const testAfwConnectionBtn = document.getElementById('test-afw-connection-btn');

        // Logging Function
        function log(msg) {
            const time = new Date().toLocaleTimeString();
            logBox.innerHTML += `<div>[${time}] ${msg}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // Update layer name input when preset selection changes
        layerSelect.addEventListener('change', () => {
            const selectedValue = layerSelect.value;
            if (selectedValue === 'AFW_CloudTops') layerNameInput.value = 'GALWEM_CloudTops';
            else if (selectedValue === 'AFW_SoilMoisture') layerNameInput.value = 'GALWEM_Soil_Moisture';
            else layerNameInput.value = ''; // Clear for NOAA layers as they use fixed names
        });


        document.getElementById('load-btn').addEventListener('click', () => {
            const selectedPreset = layerSelect.value;
            const customLayerName = layerNameInput.value.trim();
            loadWmsLayer(selectedPreset, customLayerName);
        });

        document.getElementById('clear-btn').addEventListener('click', () => {
            if (currentWmsLayer) {
                map.removeLayer(currentWmsLayer);
                currentWmsLayer = null;
                log("Map cleared.");
            }
        });

        // Event listener for the "Test AFW Connection" button
        testAfwConnectionBtn.addEventListener('click', async () => {
            const afwWmsCapabilitiesUrl = 'https://bifrost.afweather.mil/ogc/AFW_WMS?SERVICE=WMS&REQUEST=GetCapabilities&VERSION=1.3.0';
            log(`--- Testing AFW WMS Capabilities Connection ---`);
            log(`Attempting direct FETCH to AFW WMS GetCapabilities: ${afwWmsCapabilitiesUrl}`);

            try {
                // `credentials: 'include'` attempts to send cookies/client certificates with the request
                const response = await fetch(afwWmsCapabilitiesUrl, {credentials: 'include'});
                
                log(`FETCH response status: ${response.status} (${response.statusText})`);
                
                if (response.ok) { // Status 200-299
                    log('FETCH: Connection OK. Attempting to read response content...');
                    const text = await response.text();
                    if (text.includes('<WMS_Capabilities>') || text.includes('<WMT_MS_Capabilities>')) {
                        log('FETCH: Successfully received and identified WMS Capabilities XML!');
                        // To avoid cluttering the log with huge XML, just log a snippet
                        log(`First 200 chars of response: ${text.substring(0,200)}...`);
                        log('This indicates the browser *can* reach and authenticate to the WMS server.');
                        // Here you could parse `text` to extract layer names if needed for dynamic population
                    } else {
                        log('FETCH: Received response, but it does not appear to be WMS Capabilities XML.');
                        log(`First 200 chars: ${text.substring(0,200)}`);
                        log('This might indicate a content type issue or an unexpected server response.');
                    }
                } else {
                    log(`FETCH: Connection FAILED with status ${response.status}. This likely indicates:`);
                    if (response.status === 401 || response.status === 403) {
                        log(`    - Authentication issue (CAC not presented, session expired).`);
                        log(`    - Ensure you are fully logged into DataDocs in another tab, then retry.`);
                    } else { // Generic network/CORS issue that fetch still caught
                         log(`    - Browser/network blocking the request (CORS, GPO, proxy, or server not allowing cross-origin requests).`);
                         log(`    - Check browser security settings or contact IT.`);
                         log(`    - (Status code: ${response.status} - ${response.statusText})`);
                    }
                }
            } catch (error) {
                log(`FETCH CRITICAL ERROR: Could not complete request.`);
                log(`    - This usually means the browser/network is blocking the request before it even gets to the server (e.g., CORS preflight failure, proxy blocking).`);
                log(`    - Error details: ${error.message}`);
            }
            log(`--- AFW WMS Capabilities Test Complete ---`);
        });


        function loadWmsLayer(presetType, customLayerName) {
            if (currentWmsLayer) map.removeLayer(currentWmsLayer);

            const AFW_BASE_URL = 'https://bifrost.afweather.mil/ogc/AFW_WMS';
            let url = '';
            let layerName = customLayerName; 
            let format = 'image/png';
            let attribution = '';
            let errorHint = '';
            let isAFWLayer = false;
            
            // --- CONFIGURATION BLOCK ---
            if (presetType.startsWith('AFW_')) {
                url = AFW_BASE_URL; 
                attribution = 'AFWeather Bifrost';
                errorHint = 'For AFW layers: 1. Ensure you are fully logged into DataDocs in another tab. 2. Verify the "WMS Layer Name" is exact (from GetCapabilities). 3. Browser security/GPO might be blocking (contact IT if persistent).';
                isAFWLayer = true;
            } else if (presetType === 'NOAA_Radar') {
                url = 'https://nowcoast.noaa.gov/arcgis/services/nowcoast/radar_meteo_imagery_nexrad_time/MapServer/WMSServer';
                layerName = '1'; 
                attribution = 'NOAA nowCoast';
                errorHint = 'Public NOAA layer, should work if internet connectivity is fine.';
            } else if (presetType === 'NOAA_Sat') {
                url = 'https://nowcoast.noaa.gov/arcgis/services/nowcoast/sat_meteo_imagery_time/MapServer/WMSServer';
                layerName = '1'; 
                attribution = 'NOAA nowCoast';
                errorHint = 'Public NOAA layer, should work if internet connectivity is fine.';
            }

            if (!url) {
                log(`ERROR: No WMS URL defined for preset: ${presetType}`);
                return;
            }
            if (!layerName) {
                log(`ERROR: WMS Layer Name is empty for preset: ${presetType}. Please select a preset or enter a layer name.`);
                return;
            }

            log(`Attempting to load WMS layer: ${presetType}`);
            log(`WMS Base URL: ${url}`);
            log(`WMS Layer Name: ${layerName}`);

            try {
                if (isAFWLayer) {
                    // --- Use L.tileLayer for GetGTile requests for AFWeather Bifrost ---
                    // Construct the URL using the GetGTile parameters from the documentation
                    // TILEMATRIX is {z}, TILECOL is {x}, TILEROW is {y}
                    const getGTileUrl = `${url}?SERVICE=WMS&REQUEST=GetGTile&VERSION=1.3.0&LAYER=${layerName}&FORMAT=${format}&CRS=EPSG:4326&TILEMATRIX={z}&TILECOL={x}&TILEROW={y}&TRANSPARENT=TRUE&DIM_RUN=latest&DIM_FORECAST=latest`;
                    
                    log(`AFW Layer: Using GetGTile URL template: ${getGTileUrl}`);
                    
                    currentWmsLayer = L.tileLayer(getGTileUrl, {
                        attribution: attribution,
                        opacity: 0.65,
                        crossOrigin: true, // Necessary for many WMS servers and for credentials to be sent
                        // For L.tileLayer, the CRS in its options typically refers to the map's display CRS.
                        // The CRS of the *tiles* is set in the URL directly (CRS=EPSG:4326).
                        // If tiles appear distorted, we might need to explicitly define L.CRS.EPSG4326 for the map or use L.CRS.EPSG3857 in the URL.
                        // Standard practice is WebMercator (3857) for web mapping. If 4326 fails, try 3857 in the URL.
                    });

                } else {
                    // --- Use L.tileLayer.wms for standard GetMap requests for NOAA (and other general WMS) ---
                    currentWmsLayer = L.tileLayer.wms(url, {
                        layers: layerName,
                        format: format,
                        transparent: true,
                        version: '1.3.0',
                        attribution: attribution,
                        crs: L.CRS.EPSG3857, // NOAA services often prefer Web Mercator for their tiled services
                        opacity: 0.65,
                        uppercase: true, 
                        crossOrigin: true 
                    });
                }
                
                // Common event listeners for both types of layers
                currentWmsLayer.on('loading', function() {
                    log("Status: WMS layer `loading` event fired. Tiles being requested...");
                });

                currentWmsLayer.on('load', function() {
                    log("Status: WMS layer `load` event fired. All tiles may have been requested.");
                    log("Note: If map is empty, the tiles might be transparent, requests were blocked silently, or the layer doesn't cover this extent/time.");
                });
                
                currentWmsLayer.on('tileerror', function(e) {
                    let errorDetails = '';
                    if (e.error) { // e.error contains the underlying error if available (e.g. from XHR)
                        errorDetails += `Underlying Error: ${e.error.message || e.error.code || 'Unknown'}. `;
                        // If e.error is an XHR, e.error.status might be available
                        if (e.error.status) errorDetails += `HTTP Status: ${e.error.status}. `;
                    }
                    log(`ERROR: A tile failed. URL: ${e.url || 'undefined'}. ${errorDetails}. Hints: ${errorHint}`);
                });

                currentWmsLayer.addTo(map);
                log("Action: Leaflet layer added to map. Browser should be sending tile requests to WMS server.");

            } catch (e) {
                log(`CRITICAL JS ERROR during Leaflet layer creation: ${e.message}`);
            }
        }
    </script>
</body>
</html>
