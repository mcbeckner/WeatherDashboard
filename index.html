<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bifrost WMS Debugger (Advanced)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
        #controls { 
            padding: 10px; background: #333; color: white; display: flex; gap: 15px; align-items: center; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.3); z-index: 1000;
        }
        #map { flex-grow: 1; width: 100%; background: #ddd; }
        
        #debug-log {
            position: absolute; bottom: 10px; left: 10px; width: 400px; height: 200px;
            background: rgba(0, 0, 0, 0.85); color: #0f0;
            font-family: monospace; font-size: 12px;
            padding: 10px; overflow-y: auto; z-index: 2000;
            border-radius: 4px; pointer-events: none; /* Allows clicks to pass through to map */
            border: 1px solid #00ff00;
        }
        select, button { padding: 5px; border-radius: 3px; border: none; }
        button { cursor: pointer; background: #007bff; color: white; font-weight: bold; }
        button:hover { background: #0056b3; }
        .control-group { display: flex; align-items: center; gap: 5px; }
    </style>
</head>
<body>

    <div id="controls">
        <strong>Bifrost WMS Debugger</strong>
        <div class="control-group">
            <label>Layer:</label>
            <select id="layer-select">
                <!-- AFWeather / Bifrost Layers -->
                <option value="AFW_Radar">AFW Global Radar (Bifrost)</option>
                <option value="AFW_Cloud">AFW Global Cloud (Bifrost)</option>
                <option value="AFW_Vis">AFW Global Visible (Bifrost)</option>
                <!-- NOAA Backup Layers (for comparison) -->
                <option value="NOAA_Radar">NOAA NEXRAD (Public)</option>
                <option value="NOAA_Sat">NOAA Satellite (Public)</option>
            </select>
        </div>
        <div class="control-group">
            <button id="load-btn">Load Layer</button>
            <button id="clear-btn" style="background:#dc3545;">Clear Map</button>
        </div>
        <div style="margin-left:auto; font-size: 0.8em; color: #aaa;">
            <p style="margin:0;">1. Open new tab, log into <a href="https://datadocs.afweather.mil/" target="_blank" style="color:yellow;">DataDocs (CAC)</a>.</p>
            <p style="margin:0;">2. **Crucial**: Open Browser Developer Tools (F12) -> Network tab.</p>
        </div>
    </div>

    <div id="map"></div>
    <div id="debug-log">Waiting for action...</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Initialize Map
        const map = L.map('map').setView([39.8283, -98.5795], 4); // Center of US

        // Base Layer (OpenTopoMap - No API Key needed, clean terrain)
        L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17,
            attribution: 'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, <a href="http://viewfinderpanoramas.org">SRTM</a> | Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)'
        }).addTo(map);

        let currentWmsLayer = null;
        const logBox = document.getElementById('debug-log');

        // Logging Function
        function log(msg) {
            const time = new Date().toLocaleTimeString();
            logBox.innerHTML += `<div>[${time}] ${msg}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
            console.log(`[LOG] ${msg}`); // Also log to console
        }

        document.getElementById('load-btn').addEventListener('click', () => {
            const selection = document.getElementById('layer-select').value;
            loadWmsLayer(selection);
        });

        document.getElementById('clear-btn').addEventListener('click', () => {
            if (currentWmsLayer) {
                map.removeLayer(currentWmsLayer);
                currentWmsLayer = null;
                log("Map cleared.");
            }
        });

        function loadWmsLayer(type) {
            if (currentWmsLayer) map.removeLayer(currentWmsLayer);

            let url = '';
            let layerName = '';
            let format = 'image/png';
            let attribution = '';
            let errorHint = '';
            
            // --- CONFIGURATION BLOCK ---
            if (type === 'AFW_Radar') {
                url = 'https://generated.afweather.mil/wms/global_vis?';
                layerName = 'Global_Radar'; // This is the presumed layer name
                attribution = 'AFWeather Bifrost';
                errorHint = 'Check CAC, AFWeather Login, and browser security settings for generated.afweather.mil. Is the layer name correct?';
            } 
            else if (type === 'AFW_Cloud') {
                url = 'https://generated.afweather.mil/wms/global_vis?';
                layerName = 'Global_Cloud'; // This is the presumed layer name
                attribution = 'AFWeather Bifrost';
                errorHint = 'Check CAC, AFWeather Login, and browser security settings for generated.afweather.mil. Is the layer name correct?';
            }
            else if (type === 'AFW_Vis') {
                url = 'https://generated.afweather.mil/wms/global_vis?';
                layerName = 'Global_Vis'; // This is the presumed layer name
                attribution = 'AFWeather Bifrost';
                errorHint = 'Check CAC, AFWeather Login, and browser security settings for generated.afweather.mil. Is the layer name correct?';
            }
            else if (type === 'NOAA_Radar') {
                url = 'https://nowcoast.noaa.gov/arcgis/services/nowcoast/radar_meteo_imagery_nexrad_time/MapServer/WMSServer';
                layerName = '1';
                attribution = 'NOAA nowCoast';
                errorHint = 'Public layer, shouldn\'t have auth issues. Check network connectivity.';
            }
            else if (type === 'NOAA_Sat') {
                url = 'https://nowcoast.noaa.gov/arcgis/services/nowcoast/sat_meteo_imagery_time/MapServer/WMSServer';
                layerName = '1'; 
                attribution = 'NOAA nowCoast';
                errorHint = 'Public layer, shouldn\'t have auth issues. Check network connectivity.';
            }

            log(`Attempting to load: ${type}`);
            log(`URL: ${url}`);
            log(`WMS Layer: ${layerName}`);

            try {
                currentWmsLayer = L.tileLayer.wms(url, {
                    layers: layerName,
                    format: format,
                    transparent: true,
                    version: '1.3.0',
                    attribution: attribution,
                    crs: L.CRS.EPSG3857, // Standard Web Mercator
                    opacity: 0.65,
                    uppercase: true, // Some WMS servers are case-sensitive for parameters/layer names
                    crossOrigin: true // Important for allowing image data to be read if needed, but also affects security context
                });

                currentWmsLayer.on('loading', function() {
                    log("Status: WMS layer `loading` event fired. Tiles being requested.");
                });

                currentWmsLayer.on('load', function() {
                    log("Status: WMS layer `load` event fired. All visible tiles *may* have loaded successfully.");
                    log("Note: If map is empty after 'load' event, check `opacity` or if WMS images are transparent by design.");
                });
                
                currentWmsLayer.on('tileerror', function(e) {
                    // This event object 'e' typically contains 'tile' and 'url'.
                    // The actual HTTP status code is logged to the browser's console.
                    log(`ERROR: A tile failed for URL: ${e.url}. Check browser's Network tab (F12) for exact HTTP status. Hints: ${errorHint}`);
                    console.error("Leaflet tileerror event:", e); // This is where the real error object often lives.
                });

                currentWmsLayer.addTo(map);
                log("Action: Layer added to map. Now checking browser's Network tab for requests...");

            } catch (e) {
                log(`CRITICAL JS ERROR during layer creation: ${e.message}`);
                console.error("WMS Layer Creation Error:", e);
            }
        }
    </script>
</body>
</html>
